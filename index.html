<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pomo.do</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="apple-touch-icon" sizes="180x180" href="assets/images/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16x16.png">
    <link rel="manifest" href="assets/images/favicon/site.webmanifest">
    <link
        href="https://fonts.googleapis.com/css2?family=Geist+Mono:ital,wght@0,100..900;1,100..900&family=Geist:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <script type="module" src="js/app.js"></script>
</head>

<body>
    <div class="app">
        <header>
            <button id="open-sidebar-button" class="open-sidebar-button text-hover" aria-label="Open sidebar">
                <svg xmlns="http://www.w3.org/2000/svg" class="icon icon-md" viewBox="0 0 24 24" fill="none"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 5h.01" />
                    <path d="M3 12h.01" />
                    <path d="M3 19h.01" />
                    <path d="M8 5h13" />
                    <path d="M8 12h13" />
                    <path d="M8 19h13" />
                </svg>
            </button>
                <h1>pomo<span class="dot">.</span>do</h1>
        </header>
        <main class="content">
            <aside id="sidebar" class="sidebar sidebar--collapsed">
                <div class="sidebar-header">
                    <h2 class="sidebar-title">Your Tasks</h2>
                    <button id="close-sidebar-button" class="close-sidebar-button text-hover"
                        aria-label="Close sidebar">
                        <svg class="icon icon-md" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="m12 19-7-7 7-7" />
                            <path d="M19 12H5" />
                        </svg>
                    </button>
                </div>
                <form id="todo-form" class="todo-form">
                    <div class="todo-input-wrapper">
                        <input id="todo-input" type="text" placeholder="Add a task..." autocomplete="off"
                            maxlength="99">
                        <button class="add-todo-btn filled-primary-hover" type="submit" aria-label="Add task">
                            <svg class="icon icon-md" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="M5 12h14" />
                                <path d="M12 5v14" />
                            </svg>
                        </button>
                    </div>
                    <span id="task-error" class="error-message" role="alert"></span>
                </form>
                <div id="todo-list-wrapper" class="todo-list-wrapper">
                    <div class="todo-list-section">
                        <span class="todo-list-title">Active (<span id="active-task-counter">0</span>)</span>
                        <button id="clear-active-tasks-button" class="text-muted-hover">
                            <svg xmlns="http://www.w3.org/2000/svg" class="icon icon-md" viewBox="0 0 24 24" fill="none"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="M10 11v6" />
                                <path d="M14 11v6" />
                                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
                                <path d="M3 6h18" />
                                <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                            </svg>
                        </button>
                    </div>
                    <ul id="todo-list" class="todo-list"></ul>
                    <div class="todo-list-section">
                        <span class="todo-list-title">Completed (<span id="completed-task-counter">0</span>)</span>
                        <button id="clear-completed-tasks-button" class="text-muted-hover">
                            <svg xmlns="http://www.w3.org/2000/svg" class="icon icon-md" viewBox="0 0 24 24" fill="none"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="M10 11v6" />
                                <path d="M14 11v6" />
                                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
                                <path d="M3 6h18" />
                                <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                            </svg>
                        </button>
                    </div>
                    <ul id="completed-todo-list" class="todo-list"></ul>
                </div>
            </aside>
            <section class="pomodoro">
                <div class="active-task">
                    <div class="active-task-description-container">
                        <div class="active-task-dot"></div>
                        <span class="active-task-description">Current focus</span>
                    </div>
                    <span id="active-task-title" class="active-task-title" title="Select a task to focus...">Select a
                        task to focus...</span>
                </div>
                <div class="timer">
                    <div class="timer-text">
                        <span id="time-remaining" class="time-remaining">25:00</span>
                        <span id="mode-description" class="mode-description">Focus</span>
                    </div>
                </div>
                <div>
                    <span id="session-counter">1/4</span> sessions
                </div>
                <div class="action-buttons">
                    <button id="reset-button" class="reset-button text-hover" aria-label="Reset timer" disabled>
                        <svg class="icon icon-sm" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                            <path d="M3 3v5h5" />
                        </svg>
                    </button>
                    <button id="play-pause-button" class="play-pause-button filled-primary-hover"
                        aria-label="Start timer">
                        <svg class="icon icon-md" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path
                                d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z" />
                        </svg>
                    </button>
                    <button id="skip-button" class="skip-button text-hover" aria-label="Skip">
                        <svg class="icon icon-sm" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 4v16" />
                            <path
                                d="M6.029 4.285A2 2 0 0 0 3 6v12a2 2 0 0 0 3.029 1.715l9.997-5.998a2 2 0 0 0 .003-3.432z" />
                        </svg>
                    </button>
                </div>
            </section>
        </main>
    </div>

</body>

</html>
